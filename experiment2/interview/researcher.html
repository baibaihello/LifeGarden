<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>访谈链接 · 研究者</title><link rel="stylesheet" href="style.css?v=20261109-interview1"></head><body><main><div class="card"><p class="eyebrow">研究者专用，不发送本页给被试</p><h1>生成独立访谈链接</h1><p>在实验全部问卷完成后，单独发给被试。不重新分组，不调用分组接口。</p><label for="group">已经参加的实验组别</label><select id="group"><option value="R">回望组</option><option value="S">停留组</option><option value="">暂不确定（第3题用中性问法）</option></select><label for="code">实验完成码或研究编号（可留空，不填姓名）</label><input id="code" type="text" maxlength="80"><label class="check"><input id="preview" type="checkbox"><span>仅研究者预览（不上传）</span></label><p class="quiet">R/S信息只用于匹配第3题，参加者页面不显示分组名称。无法确定组别时不猜测、不自动分配。</p><textarea id="link" readonly aria-label="访谈链接"></textarea><div class="actions"><button id="copy">复制链接</button><a class="button secondary" id="open" target="_blank" rel="noopener">打开检查</a></div><p id="status" role="status"></p><h2>研究者后续核查</h2><p class="quiet">播放日志是否异常；个人“不安②”相对练习前的变化；需要修改的引导词及建议。这三项仍由研究者填写，不向被试提问。</p><p class="quiet">访谈是异步自填版，不代替一对一追问。回答不自动转写。若被试希望联系研究者，页面只提供邮箱，不会自动发邮件。</p></div></main><script>
const $=id=>document.getElementById(id);function build(){const u=new URL('index.html',location.href);if(location.protocol==='file:')u.href='https://baibaihello.github.io/LifeGarden/experiment2/interview/index.html';if($('group').value)u.searchParams.set('group',$('group').value);if($('code').value.trim())u.searchParams.set('code',$('code').value.trim());if($('preview').checked)u.searchParams.set('mode','preview');u.searchParams.set('v','20261109-interview1');$('link').value=u.href;$('open').href=u.href}
for(const id of ['group','code','preview'])$(id).addEventListener('input',build);$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('link').value);$('status').textContent='链接已复制。'}catch{$('link').select();$('status').textContent='请复制已选中的链接。'}};build();
</script></body></html>
