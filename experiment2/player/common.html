 const requiredDuration=item.video?(item.mediaIn||0)+(item.end-item.start):audio.duration;
 const remaining=(item.video?item.end:audio.duration)-audio.currentTime;
 const assetShortfall=requiredDuration-video.duration;
 // A video clock may reach its end slightly ahead of the audio clock.
 // Verify the asset length before treating that ordinary drift as missing footage.
 if(Number.isFinite(assetShortfall)&&assetShortfall>.12){
  record('video_asset_short',{requiredDuration,actualDuration:video.duration,assetShortfall,remaining});
  pause('video_too_short');status('画面素材不完整，请打开本轮完整审片包。');

  record('video_tail_hold',{requiredDuration,actualDuration:video.duration,assetShortfall,remaining});

function frame(){

   const item=currentScreen();

    phase='preparing';switchVisual(item).then(updateCaption).catch(error=>{pause('media_error');status(String(error));});

    const target=videoPosition(item);
    if(!video.seeking&&!video.ended&&Math.abs(video.currentTime-target)>.2)video.currentTime=target;
    if(segment().station&&Number.isFinite(segment().stationAt)&&audio.currentTime>=segment().stationAt){

requestAnimationFrame(frame);

if(['concrete','unclear','timeout'].includes(demonstration)){

<script>
(()=>{
 const root=document.querySelector('main'),stage=document.querySelector('.stage'),media=document.getElementById('video');
 function alignVideoOverlays(){
  const rect=media.getBoundingClientRect(),parent=root.getBoundingClientRect();
  const ratio=(media.videoWidth&&media.videoHeight)?media.videoWidth/media.videoHeight:3/4;
  let width=rect.width,height=width/ratio;
  if(height>rect.height){height=rect.height;width=height*ratio;}
  const left=rect.left+(rect.width-width)/2;
  root.style.setProperty('--frame-center-x',(left-parent.left+width*.51)+'px');
  root.style.setProperty('--frame-safe-width',(width*.88)+'px');
 }
 media.addEventListener('loadedmetadata',alignVideoOverlays);
 window.addEventListener('resize',alignVideoOverlays);
 window.addEventListener('orientationchange',()=>requestAnimationFrame(alignVideoOverlays));
 if(window.visualViewport)window.visualViewport.addEventListener('resize',alignVideoOverlays);
 if(window.ResizeObserver){const observer=new ResizeObserver(alignVideoOverlays);observer.observe(stage);observer.observe(root);}
 alignVideoOverlays();
})();
</script>
